name: Release APK

# Runs when the 'release' branch is updated. The version comes from versionName in app/build.gradle.
on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Read version
        run: |
          V=$(grep -m1 'versionName "' app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          echo "TAG=v$V" >> "$GITHUB_ENV"
      - name: Check signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing or empty"; exit 1; fi
          done
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleProdRelease
      - name: Verify signature and rename
        run: |
          APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" "ironclad-wipe-${TAG}.apk"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" "ironclad-wipe-${TAG}.apk" \
            --title "Ironclad Wipe ${TAG}" \
            --notes "Ironclad Wipe ${TAG}. Licensed under GPL-3.0; source code is in this repository."
